services:
  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s  # run the test every 5 seconds
      timeout: 5s   # the test has 5 seconds to answer
      retries: 12   # after 12 failures in a row, mark it unhealthy
    networks:
      - pacova

  auth:
    build: ./auth
    container_name: auth
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pacova

  game:
    build:
      context: .
      dockerfile: game/Dockerfile
    container_name: game
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pacova

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - auth
      - game
      - chat
      - user
    networks:
      - pacova

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - pacova

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    container_name: chat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pacova

  user:
    build: ./user
    container_name: user
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pacova

networks:
  pacova:
    name: pacova
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
  uploads_data:
    name: uploads_data
